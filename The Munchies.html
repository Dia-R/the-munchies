<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Munchies — a food diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF3E3;
    --paper-raised:#FFFCF3;
    --ink:#2B2016;
    --ink-soft:#6B5F4F;
    --line:#DFCFA9;
    --line-strong:#C9B482;
    --chili:#B3391F;
    --chili-ink:#7A2513;
    --pandan:#3E6B4B;
    --pandan-ink:#28472F;
    --turmeric:#C08A0A;
    --turmeric-ink:#805B04;
    --grey-badge:#EFE7D2;
    --grey-badge-ink:#7A6E56;
    --shadow-stamp: -0.6deg;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1712;
      --paper-raised:#252019;
      --ink:#F1E7D4;
      --ink-soft:#B4A78D;
      --line:#3C3325;
      --line-strong:#4E4230;
      --chili:#E06A4C;
      --chili-ink:#F4B7A4;
      --pandan:#7BB98C;
      --pandan-ink:#BFE3C8;
      --turmeric:#E0B23D;
      --turmeric-ink:#F1D799;
      --grey-badge:#2E2820;
      --grey-badge-ink:#B4A78D;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1712;
    --paper-raised:#252019;
    --ink:#F1E7D4;
    --ink-soft:#B4A78D;
    --line:#3C3325;
    --line-strong:#4E4230;
    --chili:#E06A4C;
    --chili-ink:#F4B7A4;
    --pandan:#7BB98C;
    --pandan-ink:#BFE3C8;
    --turmeric:#E0B23D;
    --turmeric-ink:#F1D799;
    --grey-badge:#2E2820;
    --grey-badge-ink:#B4A78D;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  a{color:var(--chili-ink);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Header ---------- */
  header.site{
    padding:2.2rem 1.5rem 1.4rem;
    text-align:center;
    position:relative;
  }
  .sign{
    display:inline-block;
    background:var(--chili);
    color:#FFF8EC;
    padding:0.55rem 1.6rem;
    transform:rotate(var(--shadow-stamp));
    border-radius:3px;
    box-shadow:3px 4px 0 var(--chili-ink);
  }
  .sign h1{
    margin:0;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(1.8rem,5vw,2.7rem);
    letter-spacing:0.01em;
  }
  header.site p.tag{
    margin:0.9rem auto 0;
    max-width:36ch;
    color:var(--ink-soft);
    font-size:0.98rem;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    justify-content:center;
    gap:0.4rem;
    padding:0 1rem 1.6rem;
    flex-wrap:wrap;
  }
  nav.tabs button{
    background:none;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    padding:0.5rem 1.1rem;
    border-radius:999px;
    font-size:0.9rem;
    font-weight:600;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  nav.tabs button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  nav.tabs button:not(.active):hover{
    border-color:var(--chili);
    color:var(--chili-ink);
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:0 1.2rem 4rem;
  }

  /* ---------- Stats ---------- */
  .stats{
    display:flex;
    gap:1rem;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:1.8rem;
  }
  .stat{
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:0.7rem 1.3rem;
    min-width:120px;
    text-align:center;
    border-radius:4px;
  }
  .stat .num{
    font-family:var(--font-display);
    font-size:1.6rem;
    font-weight:600;
    display:block;
  }
  .stat .lbl{
    font-size:0.78rem;
    color:var(--ink-soft);
  }

  /* ---------- Filter bar ---------- */
  .filterbar{
    display:flex;
    gap:0.6rem;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:1.6rem;
    padding:0.9rem;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
  }
  .filterbar input[type="search"]{
    flex:1 1 200px;
    padding:0.5rem 0.7rem;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    font-size:0.9rem;
  }
  .filterbar select{
    padding:0.5rem 0.6rem;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    font-size:0.85rem;
  }
  .filterbar .count{
    font-size:0.82rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* ---------- Card grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(255px,1fr));
    gap:1.1rem;
  }
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1.1rem 1.15rem 1rem;
    cursor:pointer;
    position:relative;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 0 -3px var(--line-strong), 0 6px 14px rgba(0,0,0,0.12);
  }
  .card .cname{
    font-family:var(--font-display);
    font-size:1.22rem;
    font-weight:600;
    margin:0 0 0.15rem;
    padding-right:2.6rem;
  }
  .card .cmeta{
    font-size:0.83rem;
    color:var(--ink-soft);
    margin-bottom:0.6rem;
  }
  .card .cmeta span:not(:last-child)::after{
    content:"·";
    margin:0 0.35rem;
    color:var(--line-strong);
  }
  .dots{
    letter-spacing:2px;
    color:var(--chili);
    font-size:0.95rem;
  }
  .dots .off{color:var(--line-strong);}
  .card .crow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:0.7rem;
    font-size:0.8rem;
  }
  .badge{
    display:inline-block;
    padding:0.18rem 0.55rem;
    border-radius:999px;
    font-size:0.72rem;
    font-weight:600;
  }
  .badge.yes{background:rgba(62,107,75,0.15); color:var(--pandan-ink);}
  .badge.no{background:rgba(179,57,31,0.13); color:var(--chili-ink);}
  .badge.unsure{background:var(--grey-badge); color:var(--grey-badge-ink);}
  .price-tag{
    position:absolute;
    top:1rem; right:1.05rem;
    font-family:var(--font-display);
    font-weight:600;
    color:var(--turmeric-ink);
    font-size:0.95rem;
  }
  .bestfor{
    margin-top:0.5rem;
    font-size:0.8rem;
    font-style:italic;
    color:var(--ink-soft);
  }
  .quick-grade{
    display:inline-flex;
    align-items:baseline;
    gap:0.4rem;
    font-family:var(--font-display);
    font-weight:700;
    color:var(--chili-ink);
    font-size:1.25rem;
    margin:0.3rem 0 0.5rem;
  }
  .quick-grade.faint-text{
    color:var(--ink-soft);
    font-weight:600;
    font-size:0.95rem;
  }
  .quick-grade .qg-pct{
    font-family:var(--font-body);
    font-weight:500;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .grade-row{
    display:flex;
    align-items:center;
    gap:1.1rem;
    flex-wrap:wrap;
    margin-bottom:1rem;
  }
  .grade-stamp{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border:2px solid var(--chili);
    border-radius:10px;
    padding:0.3rem 1rem 0.4rem;
    transform:rotate(-2.5deg);
    line-height:1.05;
  }
  .grade-stamp .letter{
    font-family:var(--font-display);
    font-size:1.9rem;
    font-weight:700;
    color:var(--chili);
  }
  .grade-stamp .pct{
    font-size:0.68rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .grade-stamp.faint{
    border-style:dashed;
    border-color:var(--line-strong);
  }
  .grade-stamp.faint .letter{ color:var(--ink-soft); font-size:1.5rem; }
  .grade-stamp.faint .pct{ color:var(--ink-soft); }
  .grade-breakdown{
    display:flex;
    gap:1.2rem;
    flex-wrap:wrap;
    font-size:0.85rem;
  }
  .grade-breakdown .k{
    display:block;
    font-size:0.7rem;
    color:var(--ink-soft);
  }
  .dish-thumb-row{
    display:flex;
    align-items:center;
    gap:0.4rem;
    margin:0.65rem 0 0.2rem;
  }
  .dish-thumb{
    width:44px; height:44px;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line);
  }
  .dish-more{
    font-size:0.75rem;
    color:var(--ink-soft);
    font-weight:600;
  }

  /* dish editor (form) */
  .dish-editor{
    border:1px solid var(--line);
    border-radius:4px;
    padding:0.8rem 0.9rem;
    margin-bottom:0.8rem;
    background:var(--paper);
  }
  .dish-editor-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.9rem;
  }
  .dish-photo-preview{
    width:72px; height:72px;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line-strong);
  }
  .dish-file-input{
    font-size:0.82rem;
    max-width:220px;
  }

  /* dish cards (detail view) */
  .dish-card{
    display:flex;
    gap:0.8rem;
    border:1px solid var(--line);
    border-radius:4px;
    padding:0.65rem;
    margin-bottom:0.6rem;
    background:var(--paper);
  }
  .dish-card img{
    width:68px; height:68px;
    object-fit:cover;
    border-radius:4px;
    flex-shrink:0;
  }
  .dish-card-noimg{
    width:68px; height:68px;
    border-radius:4px;
    flex-shrink:0;
    background:var(--grey-badge);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem;
  }
  .dish-card .dname{font-weight:600; font-size:0.92rem;}
  .dish-card .dprice{
    color:var(--turmeric-ink);
    font-weight:600;
    font-size:0.8rem;
    margin-left:0.5rem;
  }
  .dish-card .dcomment{
    font-size:0.83rem;
    color:var(--ink-soft);
    margin-top:0.25rem;
  }

  .empty{
    text-align:center;
    padding:3.5rem 1rem;
    color:var(--ink-soft);
  }
  .empty .big{font-family:var(--font-display); font-size:1.4rem; color:var(--ink); margin-bottom:0.4rem;}
  .empty button.cta{
    margin-top:1.1rem;
  }

  button.cta{
    background:var(--chili);
    color:#FFF8EC;
    border:none;
    padding:0.65rem 1.4rem;
    border-radius:4px;
    font-weight:700;
    font-size:0.92rem;
    box-shadow:2px 3px 0 var(--chili-ink);
    transition:transform 0.1s ease;
  }
  button.cta:hover{transform:translate(-1px,-1px);}
  button.cta:active{transform:translate(1px,2px); box-shadow:1px 1px 0 var(--chili-ink);}
  button.ghost{
    background:none;
    border:1px solid var(--line-strong);
    color:var(--ink);
    padding:0.6rem 1.2rem;
    border-radius:4px;
    font-size:0.88rem;
    font-weight:600;
  }
  button.ghost:hover{border-color:var(--ink);}
  button.link-btn{
    background:none;border:none;color:var(--chili-ink);text-decoration:underline;
    font-size:0.85rem;padding:0;
  }

  .fab-row{
    display:flex;
    justify-content:center;
    margin-bottom:1.6rem;
  }

  /* ---------- Form (order pad) ---------- */
  .ticket{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:1.6rem 1.6rem 2rem;
  }
  .ticket-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:0.4rem;
    flex-wrap:wrap;
    gap:0.5rem;
  }
  .ticket-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.5rem;
    margin:0;
  }
  .section{
    margin-top:1.6rem;
    padding-top:1.3rem;
    border-top:1px dashed var(--line-strong);
  }
  .section:first-of-type{border-top:none; margin-top:1rem;}
  .section h3{
    font-family:var(--font-display);
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 0.2rem;
    color:var(--chili-ink);
  }
  .section .sub{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:0 0 0.9rem;
  }
  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:0.9rem 1.1rem;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:0.3rem;
  }
  .field.wide{grid-column:1/-1;}
  .field label{
    font-size:0.8rem;
    font-weight:600;
    color:var(--ink-soft);
  }
  .field input[type="text"],
  .field input[type="url"],
  .field input[type="date"],
  .field select,
  .field textarea{
    padding:0.5rem 0.6rem;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    font-size:0.9rem;
  }
  .field textarea{resize:vertical; min-height:5em;}
  .field select.not-sure{color:var(--ink-soft);}
  .checks{
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem 0.9rem;
  }
  .checks label{
    font-size:0.85rem;
    font-weight:500;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:0.35rem;
  }
  .ticket-actions{
    display:flex;
    gap:0.7rem;
    justify-content:flex-end;
    margin-top:2rem;
    padding-top:1.2rem;
    border-top:1px dashed var(--line-strong);
    flex-wrap:wrap;
  }

  /* ---------- Dishes ---------- */
  .dish-row{
    display:flex;
    gap:0.9rem;
    align-items:flex-start;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:5px;
    padding:0.85rem;
  }
  .dish-row + .dish-row{margin-top:0.7rem;}
  .dish-photo-label{
    flex:0 0 84px;
    width:84px; height:84px;
    border:1px dashed var(--line-strong);
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    cursor:pointer;
    overflow:hidden;
    background:var(--paper-raised);
    padding:0.3rem;
  }
  .dish-photo-label img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .dish-fields{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:0.5rem;
    min-width:0;
  }
  .dish-fields .dish-top{
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
  }
  .dish-fields .dish-top input.dish-name{flex:2 1 140px;}
  .dish-fields .dish-top input.dish-price{flex:1 1 90px;}
  .dish-fields input,
  .dish-fields textarea{
    padding:0.45rem 0.55rem;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink);
    border-radius:4px;
    font-size:0.87rem;
    width:100%;
  }
  .dish-fields textarea{min-height:2.6em; resize:vertical;}
  .dish-remove{
    flex:0 0 auto;
    background:none;
    border:1px solid var(--line-strong);
    color:var(--chili-ink);
    border-radius:4px;
    font-size:0.75rem;
    padding:0.35rem 0.6rem;
    height:fit-content;
  }
  .dish-remove:hover{border-color:var(--chili);}
  .dish-add{margin-top:0.9rem;}
  .no-dishes{
    font-size:0.85rem;
    color:var(--ink-soft);
    font-style:italic;
  }

  /* dish gallery in detail view */
  .dish-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:0.8rem;
  }
  .dish-tile{
    border:1px solid var(--line);
    border-radius:5px;
    overflow:hidden;
    background:var(--paper);
  }
  .dish-tile .dish-img{
    width:100%; height:120px; object-fit:cover; display:block;
    background:var(--grey-badge);
  }
  .dish-tile .dish-img-placeholder{
    width:100%; height:120px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:1.6rem;
    background:var(--grey-badge);
  }
  .dish-tile .dish-body{padding:0.6rem 0.7rem 0.75rem;}
  .dish-tile .dish-name-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:0.4rem;
    font-weight:600; font-size:0.9rem;
  }
  .dish-tile .dish-price{color:var(--turmeric-ink); font-size:0.82rem; white-space:nowrap;}
  .dish-tile .dish-comment{
    margin-top:0.3rem; font-size:0.82rem; color:var(--ink-soft);
  }

  /* thumbnail strip on cards */
  .thumb-strip{
    display:flex;
    gap:0.3rem;
    margin-top:0.65rem;
    align-items:center;
  }
  .thumb-strip img{
    width:30px; height:30px; object-fit:cover; border-radius:4px;
    border:1px solid var(--line);
  }
  .thumb-strip .more{
    font-size:0.72rem; color:var(--ink-soft);
  }

  /* ---------- Detail overlay ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,15,10,0.5);
    display:flex; align-items:flex-start; justify-content:center;
    padding:3vh 1rem;
    overflow-y:auto;
    z-index:50;
  }
  .detail{
    background:var(--paper-raised);
    border-radius:6px;
    max-width:640px;
    width:100%;
    padding:1.8rem 1.8rem 1.6rem;
    position:relative;
    margin-bottom:2rem;
  }
  .detail .close{
    position:absolute; top:1rem; right:1rem;
    background:none; border:none;
    font-size:1.3rem; color:var(--ink-soft);
    line-height:1;
  }
  .detail h2{
    font-family:var(--font-display);
    font-size:1.6rem;
    margin:0 0 0.2rem;
    padding-right:2rem;
  }
  .detail .dmeta{
    color:var(--ink-soft);
    font-size:0.9rem;
    margin-bottom:0.9rem;
  }
  .detail .overall{
    display:flex;
    align-items:center;
    gap:0.6rem;
    margin-bottom:1rem;
  }
  .detail .overall .dots{font-size:1.3rem;}
  .detail-section{margin-top:1.3rem;}
  .detail-section h4{
    font-family:var(--font-display);
    font-size:0.95rem;
    color:var(--chili-ink);
    margin:0 0 0.6rem;
    border-bottom:1px dashed var(--line-strong);
    padding-bottom:0.35rem;
  }
  .kv-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:0.55rem 1rem;
  }
  .kv{
    font-size:0.85rem;
  }
  .kv .k{color:var(--ink-soft); display:block; font-size:0.74rem; margin-bottom:0.1rem;}
  .review-text{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    padding:0.8rem 0.9rem;
    font-size:0.9rem;
    white-space:pre-wrap;
  }
  .detail-actions{
    display:flex;
    gap:0.6rem;
    margin-top:1.6rem;
    flex-wrap:wrap;
  }
  .danger{color:var(--chili-ink);}

  footer.site{
    text-align:center;
    padding:2rem 1rem 3rem;
    color:var(--ink-soft);
    font-size:0.78rem;
  }

  /* toast + confirm dialog (replace native alert/confirm, which can be blocked in embedded contexts) */
  .toast{
    position:fixed;

<script>
(function(){

// ---------------------------------------------------------------
// Field schema

  {key:'serviceRating', label:'Service Rating', type:'rating', section:'more'},

  {key:'recommendedDishes', label:'Recommended Dishes', type:'text', section:'more', placeholder:'e.g. Chicken rice, chilli sauce on the side'},
  {key:'lastVisited', label:'Last Visited', type:'date', section:'more'},
  {key:'notes', label:'Notes / Review', type:'textarea', section:'more', wide:true, placeholder:'How was it? Anything you want to remember next time…'},
];

const SECTIONS = [
  {key:'report', title:'1 · Report Card', sub:'Rate price, taste and comfort — the overall score and grade are worked out for you.'},
  {key:'basics', title:'2 · The Basics', sub:'Where it is and how to find it.'},
  {key:'dietary', title:'3 · Dietary & Halal', sub:'Good to know before you go.'},
  {key:'amenities', title:'4 · Amenities & Comfort', sub:'What the place is actually like to sit in.'},
  {key:'dishes', title:'5 · Dishes You Ordered', sub:'Add each dish with a price, a comment, and a photo if you have one.'},
  {key:'more', title:'6 · Anything Else', sub:'Extra details worth remembering.'},
];

function letterGrade(pct){
  if(pct>=91) return 'A*';
  if(pct>=75) return 'A';
  if(pct>=60) return 'B';
  if(pct>=50) return 'C';
  if(pct>=35) return 'D';
  if(pct>=20) return 'E';
  return 'U';
}

function fmtRating(v){
  v = Number(v)||0;
  if(v<=0) return 'Not sure';
  const n = Number.isInteger(v) ? v : v.toFixed(1);
  return n + '/5';
}

// Simplified PSLE-style grade: price = Price rating, taste = Taste rating, comfort = Comfort rating
function quickGrade(r){
  const price = Number(r.valueRating)||0;
  const taste = Number(r.foodRating)||0;
  const comfort = Number(r.ambienceRating)||0;
  const vals = [price,taste,comfort].filter(v=>v>0);
  if(!vals.length) return null;
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const pct = Math.round(avg/5*100);
  return {price, taste, comfort, pct, grade:letterGrade(pct)};
}

const GRADE_TITLE = 'PSLE-style grading: A* 91-100 · A 75-90 · B 60-74 · C 50-59 · D 35-49 · E 20-34 · U below 20';

function reportCardBlock(r){
  const qg = quickGrade(r);
  if(!qg){
    return `
      <div class="grade-row">
        <div class="grade-stamp faint" title="${GRADE_TITLE}"><span class="letter">?</span><span class="pct">Not graded yet</span></div>
        <div class="grade-breakdown">
          <div><span class="k">Price</span>Not sure</div>
          <div><span class="k">Taste</span>Not sure</div>
          <div><span class="k">Comfort</span>Not sure</div>
        </div>
      </div>`;
  }
  return `
    <div class="grade-row">
      <div class="grade-stamp" title="${GRADE_TITLE}"><span class="letter">${qg.grade}</span><span class="pct">${qg.pct}%</span></div>
      <div class="grade-breakdown">
        <div><span class="k">Price</span>${fmtRating(qg.price)}</div>
        <div><span class="k">Taste</span>${fmtRating(qg.taste)}</div>
        <div><span class="k">Comfort</span>${fmtRating(qg.comfort)}</div>
      </div>
    </div>`;
}

function newDish(){
  return {id:'d'+Date.now()+Math.random().toString(36).slice(2,6), name:'', price:'', comment:'', photo:''};
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 900;
  quality = quality || 0.62;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fieldsFor(section){ return FIELDS.filter(f=>f.section===section); }

function defaultValue(f){
  if(f.type==='select') return f.options[0]; // 'Not sure'
  if(f.type==='rating') return 0; // 0 = not sure
  if(f.type==='multiselect') return ['Not sure'];
  return '';
}

function blankReview(){
  const r = {id: 'r'+Date.now()+Math.random().toString(36).slice(2,7)};
  FIELDS.forEach(f=>{ r[f.key]=defaultValue(f); });
  r.dishes = [];
  return r;
}

// ---------------------------------------------------------------
// State + storage (Firestore, with localStorage fallback)
// ---------------------------------------------------------------
const STORE_KEY = 'munchies_reviews_v1';

const firebaseConfig = {
  apiKey: "AIzaSyDIeSNtgnb4-s8CCr04MkOqfOw7BjL2WtM",
  authDomain: "munchies-de725.firebaseapp.com",
  projectId: "munchies-de725",
  storageBucket: "munchies-de725.firebasestorage.app",
  messagingSenderId: "216875312635",
  appId: "1:216875312635:web:973305e821c9a48191975e",
  measurementId: "G-5CQN6CBZX8"
};

let reviews = [];
let db = null;
let useFirestore = false;
let firstLoadDone = false;
let overlayOpen = false;

function loadLocalReviews(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    reviews = raw ? JSON.parse(raw) : [];
  }catch(e){ reviews = []; }
}

function saveLocalReviews(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(reviews)); }
  catch(e){ console.error('Could not save locally', e); showToast('Could not save — your browser storage may be full.'); }
}

function updateFooterStatus(){
  const el = document.getElementById('footer-status');
  if(!el) return;
  el.textContent = useFirestore
    ? 'Synced across your devices · The Munchies'
    : 'Saved on this device only · The Munchies';
}

function initStorage(){
  if(typeof firebase !== 'undefined' && !window.__fbLoadFailed){
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
      useFirestore = true;
      db.collection('reviews').onSnapshot(snapshot=>{
        reviews = snapshot.docs.map(d=>d.data());
        firstLoadDone = true;
        updateFooterStatus();
        if(view==='list' && !overlayOpen) renderList();
      }, err=>{
        console.error('Firestore listen error', err);
        useFirestore = false;
        showToast('Could not reach the shared database — showing reviews saved on this device only.');
        loadLocalReviews();
        firstLoadDone = true;
        updateFooterStatus();
        if(view==='list') renderList();
      });
      return;
    }catch(e){
      console.error('Firebase init failed', e);
    }
  }
  useFirestore = false;
  loadLocalReviews();
  firstLoadDone = true;
  updateFooterStatus();
}

// Persist one review. Optimistically already applied to the local `reviews` array by the caller.
function persistReview(review){
  if(useFirestore){
    db.collection('reviews').doc(review.id).set(review).catch(err=>{
      console.error('Could not save to Firestore', err);
      showToast('Could not save — the review may be too large (try fewer/smaller photos) or you may be offline.');
    });
  } else {
    saveLocalReviews();
  }
}

function persistDelete(id){
  if(useFirestore){
    db.collection('reviews').doc(id).delete().catch(err=>{
      console.error('Could not delete from Firestore', err);
      showToast('Could not delete — check your connection and try again.');
    });
  } else {
    saveLocalReviews();
  }
}

let view = 'list';
let editingId = null;
let detailId = null;
let filters = {q:'', cuisine:'', price:''};
let draft = null; // working copy while editing/creating

// ---------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------
function esc(s){
  return String(s===undefined||s===null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function dots(n){
  n = Number(n)||0;
  if(n<=0) return '<span class="dots"><span class="off">○ ○ ○ ○ ○</span></span> <span style="font-size:0.75rem;color:var(--ink-soft)">not rated</span>';
  let out='';
  for(let i=1;i<=5;i++) out += (i<=n?'●':'<span class="off">○</span>') + ' ';
  return `<span class="dots">${out.trim()}</span> <span style="font-size:0.75rem;color:var(--ink-soft)">${n}/5</span>`;
}

function triBadge(val){
  const v = val || 'Not sure';
  const cls = v==='Yes' ? 'yes' : (v==='No' ? 'no' : 'unsure');
  return `<span class="badge ${cls}">${esc(v)}</span>`;
}

function displayVal(f, v){
  if(f.type==='multiselect'){
    if(!v || !v.length || (v.length===1 && v[0]==='Not sure')) return 'Not sure';
    return v.join(', ');
  }
  if(f.type==='rating'){
    return v>0 ? (v+' / 5') : 'Not sure';
  }
  if(v===undefined||v===null||v==='') return 'Not sure';
  return v;
}

function isTriOrSelect(f){ return f.type==='select'; }

// Native alert()/confirm() can be silently blocked in an embedded/sandboxed page —
// a blocked confirm() just returns false with no dialog, which is exactly why
// Delete could silently do nothing. Use in-page UI instead.
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 3200);
}

function showConfirm(message, confirmLabel, onConfirm){
  const modal = document.createElement('div');
  modal.className = 'overlay';
  modal.style.alignItems = 'center';
  modal.innerHTML = `
    <div class="detail confirm-box">
      <p>${esc(message)}</p>
      <div class="detail-actions">
        <button class="ghost" id="confirm-cancel">Cancel</button>
        <button class="ghost danger" id="confirm-ok">${esc(confirmLabel || 'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const close = ()=> modal.remove();
  modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
  modal.querySelector('#confirm-cancel').onclick = close;
  modal.querySelector('#confirm-ok').onclick = ()=>{ close(); onConfirm(); };
}

// ---------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------
const mainEl = document.getElementById('main');

function setView(v, opts){
  opts = opts || {};
  if(v==='detail'){
    detailId = opts.id;
    view = 'list'; // detail is an overlay on top of the list, not a separate view
  } else {
    view = v;
    if(v==='form'){
      editingId = opts.editId || null;
      draft = editingId ? JSON.parse(JSON.stringify(reviews.find(r=>r.id===editingId))) : blankReview();
      if(!draft.dishes) draft.dishes = [];
    }
  }
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  render();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

function render(){
  if(view==='list') renderList();
  else if(view==='form') renderForm();
  mainEl.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> setView(el.dataset.nav));
  });
  if(view==='list' && detailId){
    renderDetailOverlay();
  }
}

function renderList(){
  if(useFirestore && !firstLoadDone){
    mainEl.innerHTML = `<div class="empty"><div class="big">Loading your reviews…</div><p>Connecting to your synced review list.</p></div>`;
    return;
  }
  const cuisines = Array.from(new Set(reviews.map(r=>r.cuisine).filter(Boolean))).sort();
  let list = reviews.slice();

  if(filters.q){
    const q = filters.q.toLowerCase();
    list = list.filter(r =>
      (r.name||'').toLowerCase().includes(q) ||
      (r.cuisine||'').toLowerCase().includes(q) ||
      (r.mrt||'').toLowerCase().includes(q) ||
      (r.bestFor||'').toLowerCase().includes(q)
    );
  }
  if(filters.cuisine) list = list.filter(r=>r.cuisine===filters.cuisine);
  if(filters.price) list = list.filter(r=>r.priceRange===filters.price);

  const pctOf = r => { const g = quickGrade(r); return g ? g.pct : -1; };
  list.sort((a,b)=> pctOf(b) - pctOf(a));

  const graded = reviews.map(quickGrade).filter(Boolean);
  const avgPct = graded.length ? Math.round(graded.reduce((s,g)=>s+g.pct,0)/graded.length) : null;
  const topGraded = graded.filter(g=>g.grade==='A*' || g.grade==='A').length;

  const statsHtml = `
    <div class="stats">
      <div class="stat"><span class="num">${reviews.length}</span><span class="lbl">places logged</span></div>
      <div class="stat"><span class="num">${avgPct!==null ? avgPct+'%' : '—'}</span><span class="lbl">avg. score</span></div>
      <div class="stat"><span class="num">${topGraded}</span><span class="lbl">graded A or A*</span></div>
    </div>`;

  const filterHtml = `
    <div class="filterbar">
      <input type="search" id="f-q" placeholder="Search name, cuisine, MRT, occasion…" value="${esc(filters.q)}">
      <select id="f-cuisine">
        <option value="">Any cuisine</option>
        ${cuisines.map(c=>`<option value="${esc(c)}" ${filters.cuisine===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <select id="f-price">
        <option value="">Any price</option>
        ${['$','$$','$$$','$$$$'].map(p=>`<option value="${p}" ${filters.price===p?'selected':''}>${p}</option>`).join('')}
      </select>
      <span class="count">${list.length} shown</span>
    </div>`;

  let bodyHtml;
  if(!reviews.length){
    bodyHtml = `
      <div class="empty">
        <div class="big">No reviews yet</div>
        <p>Start logging the places you eat at — the form takes a couple of minutes and everything defaults to "Not sure" so you never have to guess.</p>
        <button class="cta" data-nav="form">Write your first review</button>
      </div>`;
  } else if(!list.length){
    bodyHtml = `<div class="empty"><div class="big">Nothing matches those filters</div><p>Try clearing the search or filters above.</p></div>`;
  } else {
    bodyHtml = `<div class="grid">${list.map(cardHtml).join('')}</div>`;
  }

  mainEl.innerHTML = `
    ${reviews.length ? statsHtml : ''}
    <div class="fab-row"><button class="cta" data-nav="form">+ Write a review</button></div>
    ${reviews.length ? filterHtml : ''}
    ${bodyHtml}
  `;

  const qEl = document.getElementById('f-q');
  if(qEl) qEl.addEventListener('input', e=>{ filters.q=e.target.value; renderList(); attachListEvents(); });
  const cEl = document.getElementById('f-cuisine');
  if(cEl) cEl.addEventListener('change', e=>{ filters.cuisine=e.target.value; renderList(); attachListEvents(); });
  const pEl = document.getElementById('f-price');
  if(pEl) pEl.addEventListener('change', e=>{ filters.price=e.target.value; renderList(); attachListEvents(); });

  attachListEvents();
}

function attachListEvents(){
  mainEl.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=> setView(el.dataset.nav);
  });
  mainEl.querySelectorAll('.card').forEach(el=>{
    el.onclick = ()=> setView('detail', {id: el.dataset.id});
  });
}

function cardHtml(r){
  const dishes = r.dishes || [];
  const photos = dishes.filter(d=>d.photo).slice(0,4).map(d=>d.photo);
  const extra = dishes.filter(d=>d.photo).length - photos.length;
  let dishLine = '';
  if(photos.length){
    dishLine = `<div class="dish-thumb-row">${photos.map(p=>`<img class="dish-thumb" src="${p}" alt="">`).join('')}${extra>0?`<span class="dish-more">+${extra}</span>`:''}</div>`;
  } else if(dishes.length){
    dishLine = `<div class="bestfor">${dishes.length} dish${dishes.length>1?'es':''} logged</div>`;
  }
  const qg = quickGrade(r);
  const gradeLine = qg
    ? `<div class="quick-grade" title="Price ${fmtRating(qg.price)} · Taste ${fmtRating(qg.taste)} · Comfort ${fmtRating(qg.comfort)}">${qg.grade} <span class="qg-pct">${qg.pct}%</span></div>`
    : `<div class="quick-grade faint-text">Not graded yet</div>`;
  return `
    <div class="card" data-id="${r.id}">
      <div class="price-tag">${r.priceRange && r.priceRange!=='Not sure' ? esc(r.priceRange) : ''}</div>
      <div class="cname">${esc(r.name || 'Untitled place')}</div>
      ${gradeLine}
      <div class="cmeta">
        <span>${esc(r.cuisine || 'Not sure')}</span>
        <span>${esc(r.mrt ? r.mrt+' MRT' : 'Not sure')}</span>
      </div>
      ${dishLine}
      <div class="crow">
        <span style="color:var(--ink-soft)">${r.lastVisited ? 'Last visited '+esc(r.lastVisited) : 'No visit date logged'}</span>
      </div>
      ${r.bestFor ? `<div class="bestfor">Best for: ${esc(r.bestFor)}</div>` : ''}
    </div>`;
}

function renderDetailOverlay(){
  const r = reviews.find(x=>x.id===detailId);
  if(!r){ detailId=null; return; }

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="detail">
      <button class="close" aria-label="Close">✕</button>
      <h2>${esc(r.name || 'Untitled place')}</h2>
      <div class="dmeta">${esc(r.cuisine||'Not sure')} · ${esc(r.mrt ? r.mrt+' MRT' : 'Not sure')} ${r.address ? '· '+esc(r.address) : ''}</div>

      ${SECTIONS.map(sec=>{
        const title = esc(sec.title.replace(/^\d+\s*·\s*/,''));
        if(sec.key==='report'){
          return `<div class="detail-section"><h4>${title}</h4>${reportCardBlock(r)}</div>`;
        }
        if(sec.key==='dishes'){
          const dishes = r.dishes || [];
          if(!dishes.length){
            return `<div class="detail-section"><h4>${title}</h4><p class="sub" style="margin:0">Not sure — no dishes logged for this visit yet.</p></div>`;
          }
          return `<div class="detail-section"><h4>${title}</h4>${dishes.map(dishCardHtml).join('')}</div>`;
        }
        const flds = fieldsFor(sec.key).filter(f=>!['name','cuisine','mrt','address','notes'].includes(f.key));
        return `
          <div class="detail-section">
            <h4>${title}</h4>
            <div class="kv-grid">
              ${flds.map(f=>{
                let val;
                if(f.type==='rating') val = dots(r[f.key]);
                else if(isTriOrSelect(f) && TRI.includes(f.options && f.options[1])) val = triBadge(r[f.key]);
                else val = esc(displayVal(f, r[f.key]));
                return `<div class="kv"><span class="k">${esc(f.label)}</span>${val}</div>`;
              }).join('')}
            </div>
          </div>`;
      }).join('')}

      <div class="detail-section">
        <h4>Notes / Review</h4>
        <div class="review-text">${esc(r.notes) || 'Not sure — no notes yet.'}</div>
      </div>

      ${(r.mapsLink || r.menuLink) ? `
        <div class="detail-section">
          <h4>Links</h4>
          <div class="kv-grid">
            ${r.mapsLink ? `<div class="kv"><span class="k">Google Maps</span><a href="${esc(r.mapsLink)}" target="_blank" rel="noopener">Open map ↗</a></div>` : ''}
            ${r.menuLink ? `<div class="kv"><span class="k">Menu</span><a href="${esc(r.menuLink)}" target="_blank" rel="noopener">Open menu ↗</a></div>` : ''}
          </div>
        </div>` : ''}

      <div class="detail-actions">
        <button class="ghost" id="d-edit">Edit review</button>
        <button class="ghost danger" id="d-delete">Delete</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  overlayOpen = true;
  overlay.addEventListener('click', e=>{ if(e.target===overlay){ closeOverlay(overlay); } });
  overlay.querySelector('.close').onclick = ()=> closeOverlay(overlay);
  overlay.querySelector('#d-edit').onclick = ()=>{ closeOverlay(overlay); setView('form',{editId:r.id}); };
  overlay.querySelector('#d-delete').onclick = ()=>{
    showConfirm(`Delete your review of "${r.name || 'this place'}"? This can't be undone.`, 'Delete', ()=>{
      reviews = reviews.filter(x=>x.id!==r.id);
      persistDelete(r.id);
      closeOverlay(overlay);
    });
  };
}
function closeOverlay(overlay){
  overlay.remove();
  detailId = null;
  overlayOpen = false;
  if(view==='list') renderList();
}

function dishCardHtml(d){
  return `
    <div class="dish-card">
      ${d.photo ? `<img src="${esc(d.photo)}" alt="${esc(d.name||'Dish photo')}">` : `<div class="dish-card-noimg">🍽</div>`}
      <div>
        <span class="dname">${esc(d.name || 'Unnamed dish')}</span>${d.price ? `<span class="dprice">${esc(d.price)}</span>` : ''}
        ${d.comment ? `<div class="dcomment">${esc(d.comment)}</div>` : ''}
      </div>
    </div>`;
}

function renderForm(){
  const isEdit = !!editingId;
  mainEl.innerHTML = `
    <div class="ticket">
      <div class="ticket-head">
        <h2>${isEdit ? 'Edit review' : 'Write a review'}</h2>
        <button class="link-btn" data-nav="list">Cancel</button>
      </div>
      <p class="sub" style="margin-top:0">Everything defaults to "Not sure" — fill in only what you actually know.</p>
      <form id="review-form">
        ${SECTIONS.map(sec=>`
          <div class="section">
            <h3>${esc(sec.title)}</h3>
            <p class="sub">${esc(sec.sub)}</p>
            ${sec.key==='dishes' ? dishEditorHtml() :
              sec.key==='report' ? `<div class="field-grid">${fieldsFor(sec.key).map(fieldHtml).join('')}</div><div id="report-preview" style="margin-top:1.1rem">${reportCardBlock(draft)}</div>` :
              `<div class="field-grid">${fieldsFor(sec.key).map(fieldHtml).join('')}</div>`}
          </div>
        `).join('')}
        <div class="ticket-actions">
          <button type="button" class="ghost" data-nav="list">Cancel</button>
          <button type="submit" class="cta">${isEdit ? 'Save changes' : 'Save review'}</button>
        </div>
      </form>
    </div>
  `;

  // wire inputs
  FIELDS.forEach(f=>{
    if(f.type==='multiselect'){
      mainEl.querySelectorAll(`input[name="${f.key}"]`).forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const boxes = Array.from(mainEl.querySelectorAll(`input[name="${f.key}"]`));
          if(cb.value==='Not sure' && cb.checked){
            boxes.forEach(b=>{ if(b.value!=='Not sure') b.checked=false; });
          } else if(cb.checked){
            const nsBox = boxes.find(b=>b.value==='Not sure');
            if(nsBox) nsBox.checked=false;
          }
          let vals = boxes.filter(b=>b.checked).map(b=>b.value);
          if(!vals.length){ vals=['Not sure']; boxes.find(b=>b.value==='Not sure').checked=true; }
          draft[f.key] = vals;
        });
      });
    } else {
      const el = mainEl.querySelector(`[name="${f.key}"]`);
      if(!el) return;
      const evt = (f.type==='select' || f.type==='rating') ? 'change' : 'input';
      el.addEventListener(evt, ()=>{
        draft[f.key] = f.type==='rating' ? Number(el.value) : el.value;
        if(f.type==='select'){ el.classList.toggle('not-sure', el.value===f.options[0]); }
        if(f.key==='valueRating' || f.key==='foodRating' || f.key==='ambienceRating'){
          const preview = document.getElementById('report-preview');
          if(preview) preview.innerHTML = reportCardBlock(draft);
        }
      });
    }
  });

  document.getElementById('review-form').addEventListener('submit', e=>{
    e.preventDefault();
    if(!draft.name || !draft.name.trim()){
      showToast('Give the place a name before saving.');
      return;
    }
    if(isEdit){
      const idx = reviews.findIndex(r=>r.id===editingId);
      reviews[idx] = draft;
    } else {
      reviews.unshift(draft);
    }
    persistReview(draft);
    setView('detail', {id: draft.id});
  });

  mainEl.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = (ev)=>{ ev.preventDefault(); setView(el.dataset.nav); };
  });

  wireDishEditor();
}

function dishEditorHtml(){
  const dishes = draft.dishes || [];
  return `
    <div id="dish-list">
      ${dishes.length ? dishes.map(dishRowHtml).join('') : '<p class="sub" style="margin:0 0 0.8rem">No dishes added yet — add the things you actually ordered.</p>'}
    </div>
    <button type="button" class="ghost" id="add-dish">+ Add a dish</button>
  `;
}

function dishRowHtml(d, i){
  return `
    <div class="dish-editor" data-dish-id="${d.id}">
      <div class="dish-editor-head">
        <strong>Dish ${i+1}</strong>
        <button type="button" class="link-btn dish-remove" data-id="${d.id}">Remove</button>
      </div>
      <div class="field-grid" style="margin-top:0.6rem">
        <div class="field">
          <label>Dish name</label>
          <input type="text" data-dish="name" data-id="${d.id}" value="${esc(d.name)}" placeholder="e.g. Chilli crab">
        </div>
        <div class="field">
          <label>Price</label>
          <input type="text" data-dish="price" data-id="${d.id}" value="${esc(d.price)}" placeholder="e.g. $38">
        </div>
        <div class="field wide">
          <label>Comments</label>
          <textarea data-dish="comment" data-id="${d.id}" placeholder="What did you think? Would you order it again?">${esc(d.comment)}</textarea>
        </div>
        <div class="field wide">
          <label>Photo</label>
          <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap">
            ${d.photo ? `<img class="dish-photo-preview" src="${d.photo}" alt="">` : ''}
            <input class="dish-file-input" type="file" accept="image/*" data-dish="photo" data-id="${d.id}">
            ${d.photo ? `<button type="button" class="link-btn dish-photo-remove" data-id="${d.id}">Remove photo</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireDishEditor(){
  const addBtn = document.getElementById('add-dish');
  if(addBtn) addBtn.onclick = ()=>{ draft.dishes.push(newDish()); renderForm(); };

  mainEl.querySelectorAll('.dish-remove').forEach(btn=>{
    btn.onclick = ()=>{ draft.dishes = draft.dishes.filter(x=>x.id!==btn.dataset.id); renderForm(); };
  });
  mainEl.querySelectorAll('.dish-photo-remove').forEach(btn=>{
    btn.onclick = ()=>{
      const d = draft.dishes.find(x=>x.id===btn.dataset.id);
      if(d) d.photo = '';
      renderForm();
    };
  });
  mainEl.querySelectorAll('[data-dish="name"], [data-dish="price"], [data-dish="comment"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const d = draft.dishes.find(x=>x.id===el.dataset.id);
      if(d) d[el.dataset.dish] = el.value;
    });
  });
  mainEl.querySelectorAll('[data-dish="photo"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const file = el.files[0];
      if(!file) return;
      if(file.size > 10*1024*1024){
        showToast('That photo is quite large — try a smaller one.');
        return;
      }
      try{
        const dataUrl = await resizeImage(file);
        const d = draft.dishes.find(x=>x.id===el.dataset.id);
        if(d) d.photo = dataUrl;
        renderForm();
      }catch(err){
        showToast('Could not load that photo — try a different file.');
      }
    });
  });
}

function fieldHtml(f){
  const val = draft[f.key];
  const wideCls = f.wide ? ' wide' : '';
  if(f.type==='text' || f.type==='url' || f.type==='date'){
    const type = f.type==='url' ? 'url' : (f.type==='date' ? 'date' : 'text');
    return `<div class="field${wideCls}">
      <label for="fld-${f.key}">${esc(f.label)}</label>
      <input type="${type}" id="fld-${f.key}" name="${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'Not sure')}">
    </div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field${wideCls}">
      <label for="fld-${f.key}">${esc(f.label)}</label>
      <textarea id="fld-${f.key}" name="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>
    </div>`;
  }
  if(f.type==='select'){
    return `<div class="field${wideCls}">
      <label for="fld-${f.key}">${esc(f.label)}</label>
      <select id="fld-${f.key}" name="${f.key}" class="${val===f.options[0]?'not-sure':''}">
        ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>
    </div>`;
  }
  if(f.type==='rating'){
    const opts = [0,0.5,1,1.5,2,2.5,3,3.5,4,4.5,5];
    return `<div class="field${wideCls}">
      <label for="fld-${f.key}">${esc(f.label)}</label>
      <select id="fld-${f.key}" name="${f.key}" class="${val===0?'not-sure':''}">
        ${opts.map(o=>`<option value="${o}" ${Number(val)===o?'selected':''}>${o===0?'Not sure':o+' / 5'}</option>`).join('')}
      </select>
    </div>`;
  }
  if(f.type==='multiselect'){
    const vals = val || ['Not sure'];
    return `<div class="field wide">
      <label>${esc(f.label)}</label>
      <div class="checks">
        ${f.options.map(o=>`
          <label><input type="checkbox" name="${f.key}" value="${esc(o)}" ${vals.includes(o)?'checked':''}> ${esc(o)}</label>
        `).join('')}
      </div>
    </div>`;
  }
  return '';
}

// ---------------------------------------------------------------
// Nav wiring + init
// ---------------------------------------------------------------
document.querySelectorAll('#tabs button').forEach(b=>{
  b.addEventListener('click', ()=> setView(b.dataset.view));
});

initStorage();
setView('list');
})();
</script>
</body>
</html>
